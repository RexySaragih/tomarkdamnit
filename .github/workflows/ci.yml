name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      # xlsjs pulls legacy SheetJS xlsx for .xls BIFF support only (no patched npm release).
      - name: Audit
        run: >
          bun audit --audit-level=high
          --ignore=GHSA-4r6h-8v6p-xvw6
          --ignore=GHSA-5pgg-2g8v-p4x9

  # npx users run the published package on Node, not Bun.
  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.18.1", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Smoke test on Node ${{ matrix.node }}
        run: node scripts/smoke.mjs
